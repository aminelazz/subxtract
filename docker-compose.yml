services:
  subxtract:
    image: aminelazz/subxtract:dev
    container_name: subxtract
    environment:
      USERID: "${USERID:-1000}"
      GROUPID: "${GROUPID:-1000}"
      DISCORD_TOKEN: "${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env or the shell environment}"
      APP_ID: "${APP_ID:?Set APP_ID in .env or the shell environment}"
      TUNNEL_URL_FILE: "/subxtract/data/cloudflare_tunnel_url.txt"
    volumes:
      - "${SUBXTRACT_DATA_DIR:-./data}:/subxtract/data"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
