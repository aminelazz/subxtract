services:
  subxtract:
    image: aminelazz/subxtract:latest
    container_name: subxtract
    environment:
      USERID: "${USERID:-1000}"
      GROUPID: "${GROUPID:-1000}"
      DISCORD_TOKEN: "${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env or the shell environment}"
      APP_ID: "${APP_ID:?Set APP_ID in .env or the shell environment}"
      TUNNEL_URL_FILE: "/subxtract/data/cloudflare_tunnel_url.txt"
    volumes:
      - "${SUBXTRACT_DATA_DIR:-./data}:/subxtract/data"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
    command:
      - sh
      - -c
      - |
        set -eu

        CF_BIN=/subxtract/data/cloudflared
        CF_LOG=/tmp/cf_tunnel.log
        WEB_LOG=/tmp/web.log
        URL_FILE=/subxtract/data/cloudflare_tunnel_url.txt

        if [ ! -x "$$CF_BIN" ]; then
          wget -qO "$$CF_BIN" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x "$$CF_BIN"
        fi

        aria2c --conf-path=./config/aria2.conf &
        ARIA2_PID=$$!

        python3.10 -m uvicorn web.server:app \
          --host 127.0.0.1 \
          --port 8765 > "$$WEB_LOG" 2>&1 &
        WEB_PID=$$!

        "$$CF_BIN" tunnel \
          --url http://127.0.0.1:8765 \
          --no-autoupdate > "$$CF_LOG" 2>&1 &
        CF_PID=$$!

        TUNNEL_URL=""
        for i in $$(seq 1 30); do
          TUNNEL_URL=$$(grep -oE "https://[A-Za-z0-9-]+\.trycloudflare\.com" "$$CF_LOG" | head -n 1 || true)
          if [ -n "$$TUNNEL_URL" ]; then
            break
          fi
          sleep 1
        done

        if [ -z "$$TUNNEL_URL" ]; then
          echo "Cloudflare tunnel failed to start:"
          cat "$$CF_LOG"
          kill "$$ARIA2_PID" "$$WEB_PID" "$$CF_PID" 2>/dev/null || true
          exit 1
        fi

        printf "%s\n" "$$TUNNEL_URL" > "$$URL_FILE"
        echo "Cloudflare tunnel URL: $$TUNNEL_URL"

        exec python3.10 ./bot.py
